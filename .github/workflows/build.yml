name: Build Android APK

on:
  push:
    branches: [ "main", "master", "island-vibes-init" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get Dependencies
        working-directory: ./island_vibes
        run: flutter pub get

      - name: Build APK
        working-directory: ./island_vibes
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-vibes-release-apk
          path: island_vibes/build/app/outputs/flutter-apk/app-release.apk
